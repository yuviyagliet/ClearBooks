<svg width="400" height="400" viewBox="0 0 90 100" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ClearBooks Mark — Transparent Prism CB</title>
<desc>Geometric C + B prism mark — Electric Emerald to Vivid Cyan — transparent for light/dark usage</desc>
<defs>
  <linearGradient id="gC" x1="16" y1="50" x2="48" y2="50" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00E6A0"/>
    <stop offset="50%" stop-color="#00D1B8"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <linearGradient id="gBT" x1="48" y1="31" x2="74" y2="31" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00E8AC"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="gBB" x1="48" y1="69" x2="74" y2="69" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0DBF8A"/>
    <stop offset="100%" stop-color="#0EA5E9"/>
  </linearGradient>
  <linearGradient id="monoC" x1="16" y1="50" x2="48" y2="50" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E293B"/>
  </linearGradient>
</defs>
<!-- For transparent usage, counters are knocked out — use white for light bg, or set to 'none' and use evenodd clipping. Here we provide gradient facets with white counters for versatility. To use on dark, change counter fill to #0F172A -->
<g shape-rendering="geometricPrecision">
  <path d="M 24 18 L 48 18 L 48 32 L 32 32 L 32 68 L 48 68 L 48 82 L 24 82 L 16 74 L 16 26 Z" fill="url(#gC)"/>
  <path d="M 48 18 L 66 18 L 74 26 L 74 36 L 66 44 L 48 44 Z" fill="url(#gBT)"/>
  <path d="M 48 56 L 66 56 L 74 64 L 74 74 L 66 82 L 48 82 Z" fill="url(#gBB)"/>
  <!-- Counters — set fill to match page background. Default transparent knock-out via white -->
  <path d="M 54.5 26 L 62 26 L 67.2 30 L 67.2 34 L 62 38 L 54.5 38 Z" fill="white"/>
  <path d="M 54.5 62 L 62 62 L 67.2 66 L 67.2 70 L 62 74 L 54.5 74 Z" fill="white"/>
  <!-- Prism spine -->
  <line x1="48" y1="18" x2="48" y2="82" stroke="white" stroke-opacity="0.18" stroke-width="0.9"/>
</g>
</svg>
